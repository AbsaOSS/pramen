# This variable is expected to be set up by the test suite
#base.path = "/tmp"
#bookeeling JDBC configuration

pramen {
  pipeline.name = "Integration test for bulk load"

  bookkeeping.enabled = true
  temporary.directory = ${base.path}/temp

  stop.spark.session = false
  runtime.enable.repartitioning = true
  runtime.info.date.column = "dt"
}

pramen.metastore {
  tables = [
    {
      name = "table1"
      description = "Table 1"
      format = "parquet"
      path = ${base.path}/table1
    },
    {
      name = "table2"
      description = "Table 2"
      format = "iceberg"
      table = ${iceberg.table.name}
    }
  ]
}

pramen.sources.1 = [
  {
    name = "spark_source"
    factory.class = "za.co.absa.pramen.core.source.SparkSource"

    has.information.date.column = true
    information.date.column = "dt"
    information.date.type = "string"
    information.date.format = "yyyy-MM-dd"

    format = "csv"

    option {
      header = true
    }
  }
]

pramen.operations = [
  {
    name = "Sourcing from a folder"
    type = "ingestion"
    schedule.type = "daily"

    source = "spark_source"

    info.date.expr = "@runDate"

    tables = [
      {
        input.path = ${base.path}/landing
        output.metastore.table = table1

        source {
          schema = "id INT, name STRING, dt STRING"
        }
      }
    ]
  },
  {
    name = "Running a transformer"
    type = "transformation"

    class = "za.co.absa.pramen.core.transformers.IdentityTransformer"
    schedule.type = "daily"

    output.table = "table2"

    dependencies = [
      {
        tables = [ table1 ]
        date.from = "@infoDate"
      }
    ]

    option {
      input.table = "table1"
    }
  }
]
