rootLogger.level = ERROR
rootLogger.appenderRef.stdout.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# Suppress warnings logged within various components
logger.dummyprocessrunner.name = za.co.absa.pramen.core.mocks.DummyProcessRunner
logger.dummyprocessrunner.level = OFF

logger.enceladussink.name = za.co.absa.pramen.extras.sink.EnceladusSink
logger.enceladussink.level = OFF

logger.standardizationsink.name = za.co.absa.pramen.extras.sink.StandardizationSink
logger.standardizationsink.level = OFF

logger.retryablehttpclient.name = za.co.absa.pramen.extras.utils.httpclient.impl.RetryableHttpClient
logger.retryablehttpclient.level = OFF
